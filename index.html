<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Riekstukalns — rezultātu karte</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1c15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riekstukalns">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1c15; --bg-hero:#0b1510;
    --card:#1a2b21; --surface:#223828; --surface-2:#294031;
    --line:rgba(242,239,230,0.10); --line-strong:rgba(242,239,230,0.18);
    --paper:#f2efe4; --ink:#eee9db; --muted:#9db09f; --faint:#6d8172;
    --moss:#8bbf6a; --moss-deep:#3f6b3a; --amber:#cf9a3e; --brick:#c2564f; --chain:#b9c4b3;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(139,191,106,0.08), transparent 45%), var(--bg);
    color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    min-height:100vh; padding-bottom:calc(78px + var(--safe-b));
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 1.1rem; position:relative; z-index:1;}
  body > .wrap{background:var(--bg);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  /* ---------- HERO ---------- */
  .hero{
    background-image:url('hero.jpg');
    background-size:cover;
    background-position:center center;
    background-color:var(--bg-hero);
    border-bottom:1px solid var(--line);
    min-height:400px;
    display:flex; align-items:flex-end;
    padding:0;
    position:relative; overflow:hidden;
  }
  .hero-arc{position:absolute; top:14px; left:-20px; opacity:0.5; pointer-events:none; z-index:1;}
  .hero-inner{position:relative; z-index:1; width:100%; padding:2.2rem 0 1.4rem;}
  .eyebrow{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--moss); font-weight:600; margin-bottom:0.5rem; text-shadow:0 1px 8px rgba(0,0,0,0.6);}
  h1{font-family:'Oswald', sans-serif; font-weight:700; font-size:clamp(1.9rem, 8vw, 2.4rem); letter-spacing:-0.01em; margin:0 0 0.3rem; color:var(--paper); line-height:1.02; text-shadow:0 2px 14px rgba(0,0,0,0.55);}
  .subline{color:var(--muted); font-size:13.5px; margin:0; text-shadow:0 1px 8px rgba(0,0,0,0.6);}

  .course-row{display:flex; gap:8px; margin-top:1.1rem; flex-wrap:wrap;}
  .course-row .field{flex:1; min-width:130px; position:relative;}
  .course-row .field svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none; z-index:1;}
  .course-row .field input{padding-left:36px;}

  /* ---------- FIELDS ---------- */
  input[type=text], input[type=number], input[type=date]{
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:9px; font-family:inherit; font-size:13.5px; padding:0 10px; height:38px;
    outline:none; transition:border-color .15s ease; -moz-appearance:textfield; width:100%;
  }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input:focus{border-color:var(--moss);}
  input::placeholder{color:var(--faint);}

  /* ---------- TABS CONTENT ---------- */
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- PLAYERS ---------- */
  .players{display:flex; gap:8px; margin:1.5rem 0 0.9rem;}
  .player-field{flex:1; min-width:0;}
  .player-field label{display:block; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint); margin-bottom:5px; font-weight:600;}
  .player-field input{font-family:'Oswald', sans-serif; font-weight:500; font-size:14px;}
  .player-field.p1 input{border-color:rgba(139,191,106,0.35);}
  .player-field.p2 input{border-color:rgba(207,154,62,0.35);}
  .player-field.p3 input{border-color:rgba(194,86,79,0.35);}

  .section-label{display:flex; align-items:center; gap:10px; margin:1.7rem 0 0.7rem; font-family:'Oswald', sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:500;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--line);}

  /* ---------- HOLE LIST ---------- */
  .holes{display:flex; flex-direction:column; gap:6px;}
  .hole-row{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 10px; display:grid; grid-template-columns:32px 42px 1fr 1fr 1fr; gap:7px; align-items:center;}
  .hole-badge{width:32px; height:32px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px; color:var(--chain);}
  .par-field input{text-align:center; font-family:'JetBrains Mono', monospace; font-weight:600; padding:0; font-size:12.5px; height:32px; background:transparent; border:1px dashed var(--line-strong); color:var(--muted);}
  .score-field input{text-align:center; font-family:'JetBrains Mono', monospace; font-weight:700; padding:0; font-size:14px; height:32px; border-radius:50%;}
  .score-field.under input{border-color:rgba(139,191,106,0.6); color:var(--moss); background:rgba(139,191,106,0.10);}
  .score-field.over input{border-color:rgba(194,86,79,0.55); color:var(--brick); background:rgba(194,86,79,0.09);}
  .score-field.even input{border-color:var(--line-strong); color:var(--ink); border-radius:9px;}

  .col-labels{display:grid; grid-template-columns:32px 42px 1fr 1fr 1fr; gap:7px; padding:0 10px; margin-bottom:6px;}
  .col-labels span{font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--faint); text-align:center; font-weight:600;}

  /* ---------- SUMMARY ---------- */
  .summary{margin-top:1.7rem; display:flex; flex-direction:column; gap:8px;}
  .summary-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; position:relative; overflow:hidden;}
  .summary-card.leader{border-color:rgba(139,191,106,0.45);}
  .summary-card.leader::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--moss);}
  .summary-name{font-family:'Oswald', sans-serif; font-weight:500; font-size:14.5px; color:var(--paper); display:flex; align-items:center; gap:8px;}
  .crown{color:var(--amber); font-size:12px;}
  .summary-nums{display:flex; align-items:baseline; gap:10px;}
  .summary-total{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:21px; color:var(--paper);}
  .summary-diff{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px; padding:2px 8px; border-radius:6px;}
  .summary-diff.under{color:var(--moss); background:rgba(139,191,106,0.12);}
  .summary-diff.over{color:var(--brick); background:rgba(194,86,79,0.12);}
  .summary-diff.even{color:var(--muted); background:rgba(157,176,159,0.10);}

  /* ---------- ACTIONS ---------- */
  .actions{display:flex; gap:8px; margin-top:1.3rem;}
  button{font-family:'Inter', sans-serif; font-weight:500; font-size:13px; border-radius:9px; height:40px; cursor:pointer; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); flex:1; transition:background .15s ease, border-color .15s ease;}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--moss-deep); border-color:var(--moss); color:var(--paper);}
  button.danger{color:var(--brick); border-color:rgba(194,86,79,0.3);}

  /* ---------- HISTORY ---------- */
  .round-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .round-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .round-loc{font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; color:var(--paper); display:flex; align-items:center; gap:6px;}
  .round-date{font-size:11.5px; color:var(--faint); margin-top:2px;}
  .round-del{background:transparent; border:none; color:var(--faint); flex:none; width:30px; height:30px; padding:0;}
  .round-players{display:flex; flex-direction:column; gap:5px;}
  .round-player{display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:6px 10px; border-radius:8px; background:var(--surface);}
  .round-player.win{background:rgba(139,191,106,0.10); color:var(--moss);}
  .round-player .nm{display:flex; align-items:center; gap:6px; font-weight:500;}
  .round-player .vals{font-family:'JetBrains Mono', monospace; display:flex; gap:8px;}
  .empty{text-align:center; color:var(--faint); font-size:13px; padding:2.5rem 1rem;}

  /* ---------- STATS ---------- */
  .stat-row{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:12px; margin-bottom:8px;}
  .stat-rank{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; color:var(--faint); width:20px; flex:none;}
  .stat-rank.gold{color:var(--amber);}
  .stat-body{flex:1; min-width:0;}
  .stat-name{font-family:'Oswald', sans-serif; font-weight:500; font-size:14.5px; color:var(--paper);}
  .stat-sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .stat-num{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:18px; color:var(--paper); text-align:right;}
  .stat-num small{display:block; font-size:9.5px; font-weight:600; color:var(--faint); text-align:right; letter-spacing:0.06em; text-transform:uppercase;}

  .loc-row{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:8px;}
  .loc-top{display:flex; justify-content:space-between; align-items:center;}
  .loc-name{font-family:'Oswald', sans-serif; font-weight:500; font-size:14px; color:var(--paper);}
  .loc-count{font-size:11px; color:var(--faint);}
  .loc-stats{display:flex; gap:14px; margin-top:8px;}
  .loc-stat{font-size:11px; color:var(--muted);}
  .loc-stat b{display:block; font-family:'JetBrains Mono', monospace; font-size:15px; color:var(--paper); font-weight:700;}

  /* ---------- BOTTOM NAV ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:rgba(15,28,21,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(8px + var(--safe-b));
    display:flex; gap:4px; max-width:640px; margin:0 auto;
  }
  .tab-btn{flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--faint); font-size:10.5px; font-weight:600; padding:6px 0; height:auto; border-radius:10px; letter-spacing:0.02em;}
  .tab-btn.active{color:var(--moss);}
  .tab-btn svg{width:20px; height:20px;}

  @media (min-width:700px){ .hero{min-height:480px;} }
  footer{text-align:center; margin-top:2rem; font-size:11px; color:var(--faint);}

  /* ---------- SIDE ART (wide screens only) ---------- */
  .side-art{position:fixed; top:0; bottom:0; width:calc((100vw - 640px) / 2); min-width:0; pointer-events:none; z-index:0; opacity:0.9; overflow:hidden;}
  .side-art.left{left:0;}
  .side-art.right{right:0;}
  .side-art svg{position:absolute;}
  @media (max-width:980px){ .side-art{display:none;} }
</style>
</head>

    <path d="M180 240 Q140 320 100 352" stroke="#b9c4b3" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.25" fill="none"/>
    <path d="M100 410 Q160 470 210 520" stroke="#b9c4b3" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.25" fill="none"/>

</div>

  <svg class="hero-arc" width="220" height="180" viewBox="0 0 220 180" fill="none">
    <path d="M20 150 Q 20 20 190 30" stroke="#b9c4b3" stroke-width="2.5" stroke-dasharray="7 8" opacity="0.5"/>
  </svg>
  <div class="wrap hero-inner">

  <!-- ================= PLAY VIEW ================= -->

<script>
const HOLES = 18;
const KEY = 'riekstukalns-app-v2';

function todayISO(){ return new Date().toISOString().slice(0,10); }

function defaultCurrent(){
  return { location:'Riekstukalns', date:todayISO(), names:['Spēlētājs 1','Spēlētājs 2','Spēlētājs 3'],
    par:Array(HOLES).fill(3), scores:[Array(HOLES).fill(null),Array(HOLES).fill(null),Array(HOLES).fill(null)] };
}
function defaultState(){ return { current: defaultCurrent(), rounds: [] }; }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    d.current = Object.assign(d.current, parsed.current||{});
    d.rounds = Array.isArray(parsed.rounds) ? parsed.rounds : [];
    return d;
  }catch(e){ return defaultState(); }
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(state)); }

let state = load();

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function fmtDiff(d){ if(d===0) return 'E'; return d>0 ? '+'+d : String(d); }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d+'.'+m+'.'+y;
}

/* ---------------- compute helpers ---------------- */
function computeTotals(round){
  const totals=[0,0,0], pars=[0,0,0], any=[false,false,false];
  for(let p=0;p<3;p++){
    for(let i=0;i<HOLES;i++){
      const v = round.scores[p][i];
      if(v!==null && v!==undefined && !isNaN(v)){ totals[p]+=v; pars[p]+=round.par[i]; any[p]=true; }
    }
  }
  const diffs = totals.map((t,p)=> any[p] ? t-pars[p] : null);
  let best = Infinity;
  diffs.forEach((d,p)=>{ if(d!==null && d<best) best=d; });
  const winners = [];
  diffs.forEach((d,p)=>{ if(any[p] && d===best) winners.push(p); });
  return { totals, diffs, any, winners, anyScored: any.some(Boolean) };
}

/* ---------------- PLAY VIEW ---------------- */
const holesEl = document.getElementById('holes');
const summaryEl = document.getElementById('summary');

function buildHoles(){
  holesEl.innerHTML='';
  const c = state.current;
  for(let i=0;i<HOLES;i++){
    const row=document.createElement('div');
    row.className='hole-row';
    row.innerHTML =
      '<div class="hole-badge">'+(i+1)+'</div>'+
      '<div class="par-field"><input type="number" inputmode="numeric" data-role="par" data-i="'+i+'" value="'+c.par[i]+'"></div>'+
      '<div class="score-field even" data-cell="0-'+i+'"><input type="number" inputmode="numeric" placeholder="–" data-role="score" data-p="0" data-i="'+i+'"></div>'+
      '<div class="score-field even" data-cell="1-'+i+'"><input type="number" inputmode="numeric" placeholder="–" data-role="score" data-p="1" data-i="'+i+'"></div>'+
      '<div class="score-field even" data-cell="2-'+i+'"><input type="number" inputmode="numeric" placeholder="–" data-role="score" data-p="2" data-i="'+i+'"></div>';
    holesEl.appendChild(row);
  }
  syncScoreInputs();
}
function syncScoreInputs(){
  const c = state.current;
  for(let p=0;p<3;p++) for(let i=0;i<HOLES;i++){
    const v = c.scores[p][i];
    const input = holesEl.querySelector('input[data-role="score"][data-p="'+p+'"][data-i="'+i+'"]');
    if(input) input.value = v===null?'':v;
    const cell = holesEl.querySelector('[data-cell="'+p+'-'+i+'"]');
    if(cell){
      cell.classList.remove('under','over','even');
      if(v===null||v===undefined) cell.classList.add('even');
      else if(v<c.par[i]) cell.classList.add('under');
      else if(v>c.par[i]) cell.classList.add('over');
      else cell.classList.add('even');
    }
  }
}
function buildSummary(){
  const c = state.current;
  const r = computeTotals(c);
  summaryEl.innerHTML='';
  for(let p=0;p<3;p++){
    const isLeader = r.anyScored && r.winners.includes(p);
    const card=document.createElement('div');
    card.className='summary-card'+(isLeader?' leader':'');
    const diffClass = !r.any[p] ? 'even' : r.diffs[p]<0?'under':r.diffs[p]>0?'over':'even';
    card.innerHTML =
      '<div class="summary-name">'+(isLeader?'<span class="crown">●</span>':'')+escapeHtml(c.names[p])+'</div>'+
      '<div class="summary-nums"><span class="summary-total">'+(r.any[p]?r.totals[p]:0)+'</span>'+
      '<span class="summary-diff '+diffClass+'">'+(r.any[p]?fmtDiff(r.diffs[p]):'E')+'</span></div>';
    summaryEl.appendChild(card);
  }
}
function renderPlayHeader(){
  const c = state.current;
  document.getElementById('location').value = c.location;
  document.getElementById('roundDate').value = c.date;
  document.getElementById('heroTitle').textContent = c.location || 'Riekstukalns';
  ['p1','p2','p3'].forEach((id,idx)=>{ document.getElementById(id).value = c.names[idx]; document.getElementById('cl'+(idx+1)).textContent = (c.names[idx]||'P'+(idx+1)).slice(0,10); });
}

holesEl.addEventListener('input',(e)=>{
  const t=e.target; const c=state.current;
  if(t.dataset.role==='par'){ const i=+t.dataset.i; const val=parseInt(t.value,10); c.par[i]=isNaN(val)?3:val; }
  else if(t.dataset.role==='score'){ const p=+t.dataset.p,i=+t.dataset.i; const val=t.value===''?null:parseInt(t.value,10); c.scores[p][i]=(val===null||isNaN(val))?null:val; }
  syncScoreInputs(); buildSummary(); persist();
});
['p1','p2','p3'].forEach((id,idx)=>{
  document.getElementById(id).addEventListener('input',(e)=>{
    state.current.names[idx]=e.target.value;
    document.getElementById('cl'+(idx+1)).textContent=(e.target.value||'P'+(idx+1)).slice(0,10);
    buildSummary(); persist();
  });
});
document.getElementById('location').addEventListener('input',(e)=>{ state.current.location=e.target.value; document.getElementById('heroTitle').textContent=e.target.value||'Riekstukalns'; persist(); });
document.getElementById('roundDate').addEventListener('input',(e)=>{ state.current.date=e.target.value; persist(); });

document.getElementById('resetScores').addEventListener('click',()=>{
  state.current.scores=[Array(HOLES).fill(null),Array(HOLES).fill(null),Array(HOLES).fill(null)];
  syncScoreInputs(); buildSummary(); persist();
});
document.getElementById('saveRound').addEventListener('click',()=>{
  const c = state.current;
  const r = computeTotals(c);
  if(!r.anyScored){ alert('Ievadi vismaz vienu rezultātu pirms saglabāšanas.'); return; }
  const round = {
    id: Date.now(),
    date: c.date || todayISO(),
    location: c.location || 'Riekstukalns',
    names: c.names.slice(),
    par: c.par.slice(),
    scores: c.scores.map(a=>a.slice()),
    totals: r.totals, diffs: r.diffs, winners: r.winners
  };
  state.rounds.unshift(round);
  state.current = defaultCurrent();
  state.current.location = round.location;
  state.current.names = round.names.slice();
  persist();
  renderPlayHeader(); buildHoles(); buildSummary();
  renderHistory(); renderStats();
  switchView('history');
});

/* ---------------- HISTORY VIEW ---------------- */
function renderHistory(){
  const list = document.getElementById('historyList');
  if(state.rounds.length===0){ list.innerHTML='<div class="empty">Vēl nav saglabātu raundu.<br>Aizpildi rezultātus un spied “Saglabāt raundu”.</div>'; return; }
  list.innerHTML='';
  state.rounds.forEach(round=>{
    const card=document.createElement('div');
    card.className='round-card';
    let playersHtml='';
    for(let p=0;p<3;p++){
      if(round.totals[p]===0 && round.diffs[p]===null) continue;
      const win = round.winners.includes(p);
      playersHtml += '<div class="round-player'+(win?' win':'')+'"><span class="nm">'+(win?'●':'')+escapeHtml(round.names[p])+'</span>'+
        '<span class="vals"><span>'+round.totals[p]+'</span><span>'+fmtDiff(round.diffs[p])+'</span></span></div>';
    }
    card.innerHTML =
      '<div class="round-head"><div><div class="round-loc">'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-13a7 7 0 1 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>'+
      escapeHtml(round.location)+'</div><div class="round-date">'+fmtDate(round.date)+'</div></div>'+
      '<button class="round-del" data-id="'+round.id+'" aria-label="Dzēst raundu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></div>'+
      '<div class="round-players">'+playersHtml+'</div>';
    list.appendChild(card);
  });
  list.querySelectorAll('.round-del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(!confirm('Dzēst šo raundu?')) return;
      const id = +btn.dataset.id;
      state.rounds = state.rounds.filter(r=>r.id!==id);
      persist(); renderHistory(); renderStats();
    });
  });
}

/* ---------------- STATS VIEW ---------------- */
function renderStats(){
  const board = document.getElementById('leaderboard');
  const locBox = document.getElementById('locationStats');

  if(state.rounds.length===0){
    board.innerHTML = '<div class="empty">Nav pietiekami daudz datu.<br>Saglabā dažus raundus, lai redzētu statistiku.</div>';
    locBox.innerHTML='';
    return;
  }

  const players = {};
  state.rounds.forEach(round=>{
    for(let p=0;p<3;p++){
      const name = (round.names[p]||'').trim();
      if(!name) continue;
      if(round.diffs[p]===null || round.diffs[p]===undefined) continue;
      const key = name.toLowerCase();
      if(!players[key]) players[key] = { name, games:0, wins:0, totalStrokes:0, totalDiff:0, best:Infinity };
      const rec = players[key];
      rec.name = name;
      rec.games++;
      if(round.winners.includes(p)) rec.wins++;
      rec.totalStrokes += round.totals[p];
      rec.totalDiff += round.diffs[p];
      if(round.diffs[p] < rec.best) rec.best = round.diffs[p];
    }
  });
  const list = Object.values(players).sort((a,b)=> b.wins-a.wins || (a.totalDiff/a.games)-(b.totalDiff/b.games));

  board.innerHTML='';
  list.forEach((rec,idx)=>{
    const avgDiff = rec.totalDiff/rec.games;
    const avgStrokes = rec.totalStrokes/rec.games;
    const row=document.createElement('div');
    row.className='stat-row';
    row.innerHTML =
      '<div class="stat-rank'+(idx===0?' gold':'')+'">'+(idx+1)+'</div>'+
      '<div class="stat-body"><div class="stat-name">'+escapeHtml(rec.name)+'</div>'+
      '<div class="stat-sub">'+rec.games+' raundi · uzvaras: '+rec.wins+' · vid. '+avgStrokes.toFixed(1)+' met.</div></div>'+
      '<div class="stat-num">'+fmtDiff(Math.round(avgDiff*10)/10)+'<small>vid. par</small></div>';
    board.appendChild(row);
  });

  const locs = {};
  state.rounds.forEach(round=>{
    const key = round.location || 'Nezināma';
    if(!locs[key]) locs[key] = { name:key, rounds:0, diffs:[], best:Infinity, bestWho:'' };
    locs[key].rounds++;
    for(let p=0;p<3;p++){
      if(round.diffs[p]===null||round.diffs[p]===undefined) continue;
      locs[key].diffs.push(round.diffs[p]);
      if(round.diffs[p] < locs[key].best){ locs[key].best = round.diffs[p]; locs[key].bestWho = round.names[p]; }
    }
  });
  const locList = Object.values(locs).sort((a,b)=> b.rounds-a.rounds);
  locBox.innerHTML='';
  locList.forEach(loc=>{
    const avg = loc.diffs.length ? loc.diffs.reduce((a,b)=>a+b,0)/loc.diffs.length : 0;
    const row=document.createElement('div');
    row.className='loc-row';
    row.innerHTML =
      '<div class="loc-top"><span class="loc-name">'+escapeHtml(loc.name)+'</span><span class="loc-count">'+loc.rounds+' raundi</span></div>'+
      '<div class="loc-stats">'+
        '<div class="loc-stat">Vidēji<b>'+fmtDiff(Math.round(avg*10)/10)+'</b></div>'+
        '<div class="loc-stat">Labākais<b>'+(loc.best===Infinity?'—':fmtDiff(loc.best))+'</b></div>'+
        '<div class="loc-stat">Rekords<b style="font-size:12px;">'+(loc.bestWho?escapeHtml(loc.bestWho):'—')+'</b></div>'+
      '</div>';
    locBox.appendChild(row);
  });
}

/* ---------------- TABS ---------------- */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchView(btn.dataset.view));
});

/* ---------------- INIT ---------------- */
renderPlayHeader();
buildHoles();
buildSummary();
renderHistory();
renderStats();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
